<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thank You — RB Capital Ventures</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500&family=Libre+Franklin:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --parchment: #f4f0e8;
        --navy: #16283d;
        --brass: #b79a68;
        --line-light: rgba(255, 255, 255, 0.28);
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { height: 100%; }
      body {
        background: var(--navy);
        color: var(--parchment);
        font-family: "Libre Franklin", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 40px 24px;
        -webkit-font-smoothing: antialiased;
      }
      .wrap { max-width: 640px; width: 100%; }
      .eyebrow {
        font-size: 12px;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: var(--brass);
        font-weight: 600;
      }
      h1 {
        font-family: "Bodoni Moda", Georgia, "Times New Roman", serif;
        font-weight: 400;
        font-size: clamp(52px, 9vw, 92px);
        line-height: 1.02;
        margin: 22px 0 26px;
        letter-spacing: -0.01em;
      }
      p.body {
        font-size: clamp(17px, 2.2vw, 20px);
        line-height: 1.6;
        color: rgba(244, 240, 232, 0.86);
        max-width: 34em;
      }
      .btn {
        display: inline-block;
        margin-top: 40px;
        padding: 15px 30px;
        border: 1px solid var(--line-light);
        color: var(--parchment);
        text-decoration: none;
        font-size: 13px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        transition: background 0.25s ease, color 0.25s ease, border-color 0.25s ease;
      }
      .btn:hover { background: #fff; color: var(--navy); border-color: #fff; }
    </style>
  </head>
  <body>
    <main class="wrap">
      <span class="eyebrow">Contact</span>
      <h1>Thank you.</h1>
      <p class="body">
        Your submission has been received in confidence. A member of our team will review it and be
        in touch.
      </p>
      <a class="btn" href="/">Return home</a>
    </main>
  </body>
</html>
